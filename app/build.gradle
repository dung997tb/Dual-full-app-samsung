// Font Inter được lưu dạng base64 trong app/fonts-src/ (để repo chỉ chứa file text).
// Task này tự giải mã ra .ttf vào res/font/ trước mỗi lần build.
def unpackFonts = tasks.register("unpackFonts") {
    doLast {
        File srcDir = file("fonts-src")
        File fontDir = file("src/main/res/font")
        fontDir.mkdirs()
        srcDir.eachFileMatch(~/.*\.ttf\.b64/) { File b64 ->
            File ttf = new File(fontDir, b64.name.replace(".b64", ""))
            if (!ttf.exists()) {
                ttf.bytes = b64.text.trim().decodeBase64()
                println "Unpacked font: ${ttf.name}"
            }
        }
    }
}
tasks.named("preBuild").configure { dependsOn(unpackFonts) }
